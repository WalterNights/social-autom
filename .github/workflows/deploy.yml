name: Deploy al VPS

# Manual por defecto. Para que salga solo en cada push a master, descomenta el
# bloque `push`. Se deja manual a propósito: un deploy que reinicia el servidor
# cada vez que corriges una coma en el README es ruido, no automatización.
on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  #   paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      # Sin esta comprobación, un secreto ausente llega hasta ssh y lo único
      # que se ve en el log es la ayuda de ssh y un exit 255, que no dice nada.
      - name: Comprobar que los secretos están
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          faltan=""
          for n in VPS_HOST VPS_USER VPS_PATH VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!n}" ] || faltan="$faltan $n"
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan o están vacíos estos secretos:$faltan"
            echo ""
            echo "Van en Settings > Secrets and variables > Actions,"
            echo "pestaña 'Secrets' (NO 'Variables'), con estos nombres exactos:"
            echo "  VPS_HOST         la IP o el hostname del servidor"
            echo "  VPS_USER         root"
            echo "  VPS_PATH         /opt/linkedin-ops"
            echo "  VPS_SSH_KEY      la clave privada completa, con las líneas BEGIN y END"
            echo "  VPS_KNOWN_HOSTS  la salida de: ssh-keyscan -H <ip>"
            exit 1
          fi
          echo "Los cinco secretos están presentes."

      - name: Preparar la clave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Fijar la huella del host evita confiar a ciegas en quien responda.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null \
            || { echo "::error::VPS_SSH_KEY no es una clave privada válida."; exit 1; }
          echo "Clave válida."

      # Opcional: si existe el secreto ENV_FILE, el .env del servidor se
      # escribe desde ahí y no hay que copiarlo a mano nunca más.
      - name: Escribir el .env en el servidor
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "No hay secreto ENV_FILE; se deja el .env que ya tenga el servidor."
            exit 0
          fi
          # Por stdin y no como argumento: los argumentos de un comando son
          # visibles en el `ps` de cualquier usuario del servidor.
          printf '%s\n' "$ENV_FILE" | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" "umask 077; cat > '$VPS_PATH/.env'; chmod 600 '$VPS_PATH/.env'; echo '.env escrito con permisos 600'"

      - name: Actualizar el código en el servidor
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          # En una sola línea a propósito: partir el comando remoto en varias
          # líneas entre comillas es justo lo que rompió la primera versión.
          # --ff-only y no reset --hard: si el VPS tiene commits de una
          # publicación sin empujar, hay que enterarse, no pisarlos.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" "set -e; cd '$VPS_PATH'; git fetch --quiet origin; git merge --ff-only origin/master; npm ci --silent; npx playwright install chromium >/dev/null; npm run lint; npm run render; echo DEPLOY-OK"

      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/id_deploy
